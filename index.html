<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행정정보 통합관리 기본법 조항 검색</title>
  <link rel="stylesheet" href="styl.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">가상 법령 · 조항 검색</p>
      <h1>행정정보 통합관리 기본법</h1>
      <p class="subtitle">키워드로 15개 조항을 빠르게 찾아보세요.</p>

      <div class="search-wrap" role="search">
        <label class="sr-only" for="searchInput">조항 검색</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="예: 공동활용, 개인정보, 데이터 표준"
          autocomplete="off"
        />
        <button id="clearButton" type="button" aria-label="검색어 지우기">지우기</button>
      </div>

      <div class="meta-row">
        <strong id="resultCount">결과 0건</strong>
        <a href="가상_행정정보통합관리법.md" class="source-link">법령 원문(.md) 보기</a>
      </div>
    </div>
  </header>

  <main class="content">
    <section id="cardContainer" class="card-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-icon">🔎</p>
      <h2>검색 결과가 없습니다.</h2>
      <p>다른 키워드로 검색해 보세요.</p>
    </div>
  </main>

  <footer>
    <p>본 페이지는 연습용 가상 법령 데이터를 기반으로 제작되었습니다.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
